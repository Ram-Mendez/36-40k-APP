name: Java 21 verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit, PostgreSQL integration and concurrency tests
        run: bash ./mvnw -B -ntp clean verify
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/site/jacoco
      - name: Build container
        run: docker build -t business-operations-backend:ci .
