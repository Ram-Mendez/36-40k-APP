name: business-operations-autonomia-v3
services:
  postgres:
    image: postgres:16.13-alpine
    environment:
      POSTGRES_DB: autonomia_v3
      POSTGRES_USER: business
      POSTGRES_PASSWORD: business_dev_only
    ports:
      - "127.0.0.1:25436:5432"
    volumes:
      - datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U business -d autonomia_v3"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  datos:
