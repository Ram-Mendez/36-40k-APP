name: business-operations
services:
  postgres:
    image: postgres:16.13-alpine
    environment:
      POSTGRES_DB: business_operations
      POSTGRES_USER: business
      POSTGRES_PASSWORD: ${DB_PASSWORD:-business_dev_only}
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - operations-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U business -d business_operations"]
      interval: 5s
      timeout: 3s
      retries: 20
  carrier:
    build: ./infra/carrier
    environment:
      CARRIER_MODE: ${CARRIER_MODE:-normal}
    ports:
      - "127.0.0.1:9096:9096"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9096/health"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: dev,container
      DB_PASSWORD: ${DB_PASSWORD:-business_dev_only}
      JWT_SECRET: ${JWT_SECRET:-development-only-jwt-key-change-before-production-2026}
    ports:
      - "127.0.0.1:8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      carrier:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8086/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 12
volumes:
  operations-data:
