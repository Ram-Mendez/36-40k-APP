apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping-service
  namespace: backend-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shipping-service
  template:
    metadata:
      labels:
        app: shipping-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
      containers:
        - name: shipping-service
          image: shipping-service:ci
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9096
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=60 -XX:InitialRAMPercentage=20"
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: shipping-service
  namespace: backend-lab
spec:
  type: ClusterIP
  selector:
    app: shipping-service
  ports:
    - name: http
      port: 9096
      targetPort: http
