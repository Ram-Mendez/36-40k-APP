spring:
  application:
    name: business-operations-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5436/business_operations}
    username: ${DB_USER:business}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 12
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${SERVER_PORT:8086}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
security:
  bootstrap:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
  jwt:
    secret: ${JWT_SECRET}
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:P7D}
  swagger-enabled: ${SWAGGER_ENABLED:false}
shipping:
  base-url: ${SHIPPING_BASE_URL:http://localhost:9096}
  connect-timeout: 2s
  read-timeout: 3s
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
logging:
  pattern:
    level: '%5p [requestId=%X{requestId:-none}]'
